name = "cofre-investimentos-functions"
main = "./worker.ts"
compatibility_date = "2026-07-08"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[vars]
# Comma-separated host allowlist. Add preview domains only if you want them to call the Worker.
ALLOWED_ORIGIN_HOSTS = "cofreinvestimentos.com.br,www.cofreinvestimentos.com.br,localhost,127.0.0.1,vercel.app"
# Private portfolio AI access. OPENAI_API_KEY must be configured as a Worker secret.
AI_ANALYSIS_EMAILS = "claudiorico81@gmail.com,claudiorico81@hotmail.com"
OPENAI_MODEL = "gpt-5"
